[project]
name = "sonar-backend"
version = "0.1.0"
description = "Sonar: search the real world by calling it."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "respx",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs the compose Postgres (make db-up)",
    "live: places real calls; only runs when RUN_LIVE=1",
]
addopts = "-m 'not integration and not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls these in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # generated migrations
"tests/*" = ["E501"]  # long assertion lines read better unwrapped
"app/api/shop.py" = ["E501"]  # contains an inline HTML page

[tool.ruff.lint.isort]
# backend/alembic/ (our migrations folder) must not be mistaken for the alembic library
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]
